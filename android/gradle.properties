# -Xmx was 8G, exceeding this machine's entire 7.9G physical RAM —
# harmless when nothing else was competing for memory, but a real
# OOM once several concurrent processes (multiple Claude Code
# sessions, the emulator/adb tooling) pushed free memory below what
# an 8G heap request needs to even reserve. Dropped to 3G, then hit a
# genuine native-malloc OOM crash even at 3G with under 1.5G free
# system-wide (this machine: 4-core i5-3337U, 7G total) — 1.5G is the
# real safe ceiling on this box under load, not a preference
# (2026-08-27).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin compilation was hanging indefinitely on this machine when run
# via a separate out-of-process Kotlin compile daemon (observed:
# near-zero CPU growth for 8+ minutes at :app:compileDebugKotlin,
# specifically on Windows). Forcing in-process compilation avoids the
# daemon IPC path entirely.
kotlin.compiler.execution.strategy=in-process
# Daemon off (2026-08-27): on this machine's tight 7.9G RAM, a
# lingering Gradle daemon (900MB+) plus this session's own tooling
# was enough on its own to push a subsequent build into real OOM.
# Costs a slower per-build JVM startup; worth it for not silently
# accumulating memory across builds run back-to-back.
org.gradle.daemon=false
