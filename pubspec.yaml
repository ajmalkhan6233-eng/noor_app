name: noor
description: "A clean, privacy-first, ad-free Islamic utility app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  adhan: ^2.0.0
  sqflite_sqlcipher: ^3.1.0
  path: ^1.9.0
  shared_preferences: ^2.2.2
  geolocator: ^10.1.0
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/database/
