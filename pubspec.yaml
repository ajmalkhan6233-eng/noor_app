# Bismillahir Rahmanir Raheem
# noor — watermark: ALLAH
name: noor
description: "A clean, privacy-first, ad-free Islamic utility app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Offline prayer-time math (no network calls)
  adhan: ^2.0.0

  # Encrypted local database
  sqflite_sqlcipher: ^3.1.0
  path: ^1.9.0
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3

  # Preferences & hardware access (all local/offline)
  shared_preferences: ^2.2.2
  geolocator: ^10.1.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  sensors_plus: ^7.0.0

  # Parses the bundled Tanzil surah-metadata XML (offline, no network)
  xml: ^6.5.0

  # Hands off to WhatsApp/the mail app for the Support Developer screen
  # — an OS-level app launch (like opening a browser link), not a
  # network call noor itself makes; adds no INTERNET permission.
  url_launcher: ^6.2.0

  # Adhan and bundled Quran playback are local-asset only, never
  # streamed (see assets/audio/adhan/README.md for provenance).
  # Downloaded Quran audio (surah_audio_download_service.dart) plays
  # from a local file too, once saved — audioplayers itself never
  # makes a network call either way.
  audioplayers: ^5.2.1
  cryptography: ^2.9.0
  share_plus: ^12.0.2
  path_provider: ^2.1.6

  # This app's one and only network-capable feature: optional,
  # user-initiated Quran audio downloads (see
  # surah_audio_download_service.dart and CLAUDE.md's Non-Negotiable
  # Architecture section for the full scoping decision).
  http: ^1.2.0

  # On-device text-to-speech (Android TextToSpeech / iOS
  # AVSpeechSynthesizer) for reading Azkar/Dua English translations
  # aloud — no network call from the app itself; the OS may prompt to
  # install a voice pack via system settings if none exists, same as
  # any other OS-level capability.
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.4.2
  fake_async: ^1.3.1
  # Used directly by surah_audio_download_service_test.dart to fake
  # the app-support directory rather than hitting the real platform
  # channel — path_provider itself already declares both as transitive
  # deps, this just makes the direct test import explicit.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/database/
    - assets/quran/
    - assets/quran_translations/
    - assets/azkar/
    - assets/audio/adhan/
    - assets/quran/audio/juz_amma/
    - assets/quran/audio/popular/
    - assets/qibla/
  fonts:
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond/CormorantGaramond.ttf
        - asset: assets/fonts/CormorantGaramond/CormorantGaramond-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter.ttf
        - asset: assets/fonts/Inter/Inter-Italic.ttf
          style: italic
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri/Amiri-Bold.ttf
          weight: 700
    - family: Noto Sans Tamil
      fonts:
        - asset: assets/fonts/NotoSansTamil/NotoSansTamil-VariableFont_wdth,wght.ttf
    - family: Noto Sans Sinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala/NotoSansSinhala-VariableFont_wdth,wght.ttf
