          PAYLOAD
          ACTUAL=$(sha256sum /tmp/noor.tar.xz | cut -d' ' -f1)
          if [ "$ACTUAL" != "$PAYLOAD_SHA256" ]; then
            echo "::error::Payload checksum mismatch - the paste was truncated or altered."
            echo "expected $PAYLOAD_SHA256"
            echo "actual   $ACTUAL"
            exit 1
          fi
          tar xJf /tmp/noor.tar.xz -C .
          rm -f /tmp/noor.tar.xz
          echo "Source tree unpacked:"
          find lib -name '*.dart' | sort

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: noor-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: noor-${{ runner.os }}-

      - name: Ensure declared asset folders exist
        run: |
          mkdir -p assets/database
          [ -f assets/database/.gitkeep ] || echo "placeholder" > assets/database/.gitkeep

      - name: Generate Android platform files
        run: |
          if [ -d android ]; then
            echo "android/ already present - skipping."
          else
            cp pubspec.yaml pubspec.yaml.bak
            flutter create --platforms=android \
              --project-name noor --org com.noorapp .
            mv pubspec.yaml.bak pubspec.yaml
          fi

      - name: Commit scaffolded sources back to repo
        run: |
          git config user.name  "noor-bootstrap[bot]"
          git config user.email "noor-bootstrap@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "chore: bootstrap Noor project scaffold and Android platform files"
            git push origin HEAD:${{ github.ref_name }}
            echo "Sources committed - future runs will build only."
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Guard - 150 line file limit
        continue-on-error: true
        run: |
          OVER=0
          while IFS= read -r f; do
            N=$(wc -l < "$f")
            if [ "$N" -gt 150 ]; then
              echo "::warning file=$f::$f has $N lines (limit 150)"
              OVER=1
            fi
          done < <(find lib -name '*.dart')
          [ "$OVER" -eq 0 ] && echo "All Dart files within the 150 line limit."

      - name: Guard - offline first (no network or analytics SDKs)
        continue-on-error: true
        run: |
          BANNED='package:(http|dio|firebase|google_mobile_ads|sentry|mixpanel|amplitude|posthog)'
          if grep -rnE "$BANNED" lib/ 2>/dev/null; then
            echo "::warning::Networking or analytics package detected in lib/"
          else
            echo "No banned packages found - offline-first intact."
          fi

      - name: Guard - accessibility semantics present
        continue-on-error: true
        run: |
          COUNT=$(grep -rl 'Semantics' lib/ 2>/dev/null | wc -l)
          echo "Files referencing Semantics(): $COUNT"
          [ "$COUNT" -gt 0 ] || echo "::warning::No Semantics() usage found in lib/"

      - name: Static analysis
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-number ${{ github.run_number }}

      - name: Write build summary
        if: always()
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          {
            echo "## Noor build #${{ github.run_number }}"
            echo ""
            if [ -f "$APK" ]; then
              echo "**Status:** APK built successfully"
              echo ""
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| APK size | $(du -h \"$APK\" | cut -f1) |"
              echo "| Flutter | $(flutter --version | head -1) |"
              echo "| Commit | \`${{ github.sha }}\` |"
              echo ""
              echo "Signed with a debug key - sideload only, not Play Store ready."
            else
              echo "**Status:** build failed - no APK produced."
              echo ""
              echo "Open the failed step above to read the error."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: noor-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
