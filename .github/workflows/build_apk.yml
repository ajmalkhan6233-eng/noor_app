# Bismillahir Rahmanir Raheem - watermark: ALLAH
# Noor - Android release build (v2).
# Source is already committed to the repo, so this build only compiles.
# Gradle is patched for plugin requirements before building, and any
# build error is echoed into the job summary so it can be read without
# opening the raw log.

name: Build Noor Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Scaffold and build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: noor-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: noor-${{ runner.os }}-

      - name: Ensure asset folders exist
        run: mkdir -p assets/database

      - name: Regenerate Android platform files if missing
        run: |
          if [ ! -d android ]; then
            cp pubspec.yaml pubspec.yaml.bak
            flutter create --platforms=android \
              --project-name noor --org com.noorapp .
            mv pubspec.yaml.bak pubspec.yaml
          fi

      - name: Patch Gradle for plugin requirements
        run: |
          cat > /tmp/patch_gradle.py <<'PATCHER'
          #!/usr/bin/env python3
          """Patch android/app/build.gradle[.kts] for Noor's plugin requirements.

          flutter_local_notifications needs core library desugaring; sqflite_sqlcipher
          and geolocator need a modern minSdk. Handles both Kotlin and Groovy DSL.
          Idempotent: safe to run on every build.
          """
          import re
          import sys
          import pathlib

          DESUGAR_LIB = "com.android.tools:desugar_jdk_libs:2.1.4"
          MIN_SDK = "23"
          COMPILE_SDK = "35"


          def patch(path: pathlib.Path) -> str:
              src = path.read_text()
              kts = path.suffix == ".kts"
              notes = []

              # 1. SDK levels -----------------------------------------------------
              if kts:
                  new = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", f"minSdk = {MIN_SDK}", src)
                  new = re.sub(r"compileSdk\s*=\s*flutter\.compileSdkVersion",
                               f"compileSdk = {COMPILE_SDK}", new)
              else:
                  new = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion",
                               f"minSdkVersion {MIN_SDK}", src)
                  new = re.sub(r"compileSdkVersion\s+flutter\.compileSdkVersion",
                               f"compileSdkVersion {COMPILE_SDK}", new)
              if new != src:
                  notes.append(f"SDK levels pinned (min {MIN_SDK}, compile {COMPILE_SDK})")
              src = new

              # 2. Java 17 + desugaring inside compileOptions ---------------------
              if "CoreLibraryDesugaringEnabled" not in src and "coreLibraryDesugaringEnabled" not in src:
                  if kts:
                      block = (
                          "compileOptions {\n"
                          "        isCoreLibraryDesugaringEnabled = true\n"
                          "        sourceCompatibility = JavaVersion.VERSION_17\n"
                          "        targetCompatibility = JavaVersion.VERSION_17\n"
                          "    }"
                      )
                  else:
                      block = (
                          "compileOptions {\n"
                          "        coreLibraryDesugaringEnabled true\n"
                          "        sourceCompatibility JavaVersion.VERSION_17\n"
                          "        targetCompatibility JavaVersion.VERSION_17\n"
                          "    }"
                      )
                  src, n = re.subn(r"compileOptions\s*\{[^}]*\}", block, src, count=1)
                  if n:
                      notes.append("core library desugaring enabled, Java 17")
                  else:
                      # No compileOptions block at all - inject after android {
                      src = re.sub(r"(android\s*\{)", r"\1\n    " + block, src, count=1)
                      notes.append("compileOptions block created with desugaring")

              # 3. Kotlin jvmTarget ----------------------------------------------
              if "jvmTarget" in src:
                  src = re.sub(r'jvmTarget\s*=\s*JavaVersion\.VERSION_\w+\.toString\(\)',
                               'jvmTarget = JavaVersion.VERSION_17.toString()', src)
                  src = re.sub(r"jvmTarget\s*=\s*['\"][\d.]+['\"]",
                               'jvmTarget = "17"', src)
                  notes.append("Kotlin jvmTarget set to 17")

              # 4. Desugaring dependency -----------------------------------------
              has_dep = re.search(r"coreLibraryDesugaring\s*[('\"]", src) is not None
              if not has_dep:
                  if kts:
                      dep = f'\ndependencies {{\n    coreLibraryDesugaring("{DESUGAR_LIB}")\n}}\n'
                  else:
                      dep = f"\ndependencies {{\n    coreLibraryDesugaring '{DESUGAR_LIB}'\n}}\n"
                  src = src.rstrip() + "\n" + dep
                  notes.append(f"desugar_jdk_libs dependency added")

              path.write_text(src)
              return "; ".join(notes) if notes else "already patched, no changes"


          if __name__ == "__main__":
              target = None
              for candidate in ("android/app/build.gradle.kts", "android/app/build.gradle"):
                  p = pathlib.Path(candidate)
                  if p.exists():
                      target = p
                      break
              if target is None:
                  print("::error::No android/app/build.gradle[.kts] found")
                  sys.exit(1)
              print(f"Patching {target}")
              print("  ->", patch(target))
          PATCHER
          python3 /tmp/patch_gradle.py

      - name: Show patched Gradle config
        run: |
          F=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          echo "--- $F ---"
          cat "$F"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        id: apk
        run: |
          set -o pipefail
          flutter build apk --release \
            --build-number ${{ github.run_number }} 2>&1 | tee /tmp/build.log

      - name: Publish build error to summary
        if: failure()
        run: |
          {
            echo "## Build failed - error detail"
            echo ""
            echo "Last 120 lines of the Gradle output:"
            echo ""
            echo '```'
            tail -n 120 /tmp/build.log 2>/dev/null || echo "no build log captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish success summary
        if: success()
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          {
            echo "## Noor build #${{ github.run_number }}"
            echo ""
            echo "**APK built successfully.**"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Size | $(du -h \"$APK\" | cut -f1) |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "Debug-signed - sideload only, not Play Store ready."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: noor-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
