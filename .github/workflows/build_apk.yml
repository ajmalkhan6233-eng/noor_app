# Bismillahir Rahmanir Raheem - watermark: ALLAH
# Noor - Android release build (v3).
#
# compileSdk is forced via a Gradle init script in ~/.gradle/init.d/
# rather than in android/app/build.gradle.kts, because `flutter build`
# rewrites that file during its own migration and discards edits.

name: Build Noor Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Scaffold and build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: noor-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: noor-${{ runner.os }}-

      - name: Install Gradle init script
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/noor_android_config.gradle <<'INITSCRIPT'
          // Bismillahir Rahmanir Raheem - watermark: ALLAH
          //
          // Gradle init script for the Noor build.
          //
          // This lives in ~/.gradle/init.d/ rather than in the project, because
          // `flutter build` rewrites android/app/build.gradle.kts during its own
          // migration step and would discard edits made there. Gradle applies
          // every script in init.d to every build, so these settings survive.

          allprojects { proj ->
              proj.afterEvaluate {
                  def android = proj.extensions.findByName('android')
                  if (android == null) return

                  // 1. compileSdk 36 - required by geolocator_android,
                  //    shared_preferences_android and sqflite_sqlcipher.
                  try {
                      android.compileSdk = 36
                  } catch (Throwable t1) {
                      try {
                          android.compileSdkVersion 36
                      } catch (Throwable t2) {
                          println "noor-init: could not set compileSdk on ${proj.path}"
                      }
                  }

                  // 2. Application module only: minSdk and core library desugaring
                  //    (flutter_local_notifications requires desugaring).
                  if (proj.plugins.hasPlugin('com.android.application')) {
                      try {
                          android.defaultConfig.minSdk = 23
                      } catch (Throwable t) {
                          println "noor-init: could not set minSdk"
                      }
                      try {
                          android.compileOptions.coreLibraryDesugaringEnabled = true
                          proj.dependencies.add(
                              'coreLibraryDesugaring',
                              'com.android.tools:desugar_jdk_libs:2.1.4')
                      } catch (Throwable t) {
                          println "noor-init: desugaring not applied (${t.message})"
                      }
                  }

                  println "noor-init: ${proj.path} compileSdk -> ${android.compileSdk}"
              }
          }
          INITSCRIPT
          echo "--- installed init script ---"
          cat ~/.gradle/init.d/noor_android_config.gradle

      - name: Ensure asset folders exist
        run: mkdir -p assets/database

      - name: Regenerate Android platform files if missing
        run: |
          if [ ! -d android ]; then
            cp pubspec.yaml pubspec.yaml.bak
            flutter create --platforms=android \
              --project-name noor --org com.noorapp .
            mv pubspec.yaml.bak pubspec.yaml
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release \
            --build-number ${{ github.run_number }} 2>&1 | tee /tmp/build.log

      - name: Publish build error to summary
        if: failure()
        run: |
          {
            echo "## Build failed"
            echo ""
            echo "### compileSdk actually used"
            echo '```'
            grep "noor-init:" /tmp/build.log 2>/dev/null | head -20 \
              || echo "init script produced no output - it did not run"
            echo '```'
            echo ""
            echo "### Last 100 lines"
            echo '```'
            tail -n 100 /tmp/build.log 2>/dev/null || echo "no log captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish success summary
        if: success()
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          {
            echo "## Noor build #${{ github.run_number }}"
            echo ""
            echo "**APK built successfully.**"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Size | $(du -h \"$APK\" | cut -f1) |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "Debug-signed - sideload only, not Play Store ready."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: noor-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
