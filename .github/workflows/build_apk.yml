# Bismillahir Rahmanir Raheem - watermark: ALLAH
# Noor - Android release build (v5).
#
# compileSdk is forced by APPENDING a second `android { }` block to
# android/app/build.gradle.kts rather than by editing the existing one.
# Kotlin DSL allows the extension to be configured repeatedly, and the
# later block wins - so there is no pattern to fail to match.
#
# Pass 1 runs first (and may fail) purely so Flutter performs its own
# build.gradle.kts rewrite before the override is appended.

name: Build Noor Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Scaffold and build
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: noor-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: noor-${{ runner.os }}-

      - name: Ensure asset folders exist
        run: mkdir -p assets/database

      - name: Resolve dependencies
        run: flutter pub get

      - name: Pass 1 - let Flutter run its Gradle migration
        run: |
          echo "Expected to fail. Runs only so Flutter rewrites"
          echo "build.gradle.kts before the override is appended."
          timeout 600 flutter build apk --release 2>&1 | tail -n 15 || true

      - name: Append build overrides
        run: |
          cat > /tmp/append_override.sh <<'APPENDER'
          #!/bin/bash
          # Append an override block to android/app/build.gradle.kts.
          # Kotlin DSL allows configuring the `android` extension more than once,
          # so a second block simply overrides values from the first. No regex,
          # nothing to fail to match.
          set -e
          F=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          if [ -z "$F" ]; then
            echo "::error::No android/app/build.gradle[.kts] found"
            exit 1
          fi

          if grep -q "NOOR_BUILD_OVERRIDES" "$F"; then
            echo "Overrides already present in $F"
            exit 0
          fi

          if [ "${F##*.}" = "kts" ]; then
            cat >> "$F" << 'KTS'

          // --- NOOR_BUILD_OVERRIDES ---
          // Appended by CI. Kotlin DSL permits configuring the android extension
          // more than once; this block runs after the one above and wins.
          // compileSdk 36 is required by geolocator_android,
          // shared_preferences_android and sqflite_sqlcipher.
          android {
              compileSdk = 36
              defaultConfig {
                  minSdk = 23
              }
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          KTS
          else
            cat >> "$F" << 'GROOVY'

          // --- NOOR_BUILD_OVERRIDES ---
          android {
              compileSdk 36
              defaultConfig {
                  minSdkVersion 23
              }
              compileOptions {
                  coreLibraryDesugaringEnabled true
              }
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
          }
          GROOVY
          fi
          echo "Overrides appended to $F"
          APPENDER
          bash /tmp/append_override.sh
          F=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          echo "GRADLE_FILE=$F" >> "$GITHUB_ENV"
          echo "--- $F after append ---"
          cat "$F"
          if ! grep -q "compileSdk = 36" "$F" && ! grep -q "compileSdk 36" "$F"; then
            echo "::error::Override block missing after append."
            exit 1
          fi
          echo "Verified: compileSdk 36 present."

      - name: Pass 2 - build release APK
        run: |
          set -o pipefail
          flutter build apk --release --no-pub \
            --build-number ${{ github.run_number }} 2>&1 | tee /tmp/build.log

      - name: Publish failure detail to summary
        if: failure()
        run: |
          F="${GRADLE_FILE:-android/app/build.gradle.kts}"
          {
            echo "## Build failed"
            echo ""
            echo "### $F"
            echo '```kotlin'
            cat "$F" 2>/dev/null || echo "file not found"
            echo '```'
            echo ""
            echo "### Last 80 lines of build output"
            echo '```'
            tail -n 80 /tmp/build.log 2>/dev/null || echo "no log captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish success summary
        if: success()
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          {
            echo "## Noor build #${{ github.run_number }}"
            echo ""
            echo "**APK built successfully.**"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Size | $(du -h \"$APK\" | cut -f1) |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "Debug-signed - sideload only, not Play Store ready."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: noor-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
