# Bismillahir Rahmanir Raheem - watermark: ALLAH
# Noor - bootstrap + Android release build.
# First run scaffolds the full project into this repo, then builds an APK.
# Every run after that skips the scaffold and just builds.

name: Build Noor Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PAYLOAD_SHA256: "c7a098aa1827ef30d250595ed5182ac0d0827cb336a191c9a68229af22b62c16"

jobs:
  build:
    name: Scaffold and build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect whether project already exists
        id: state
        run: |
          if [ -f lib/main.dart ] && [ -f pubspec.yaml ]; then
            echo "scaffolded=true" >> "$GITHUB_OUTPUT"
            echo "Project already present - skipping bootstrap."
          else
            echo "scaffolded=false" >> "$GITHUB_OUTPUT"
            echo "Empty repo detected - bootstrap will run."
          fi

      - name: Unpack Noor source payload
        if: steps.state.outputs.scaffolded == 'false'
        run: |
          base64 -d -i <<'PAYLOAD' > /tmp/noor.tar.xz
