name: update-core-architecture

on:
  push:
    paths:
      - '.github/workflows/update_core_architecture.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify payload
        env:
          PAYLOAD_B64: ""
        run: |
          echo "$PAYLOAD_B64" | base64 -d > /tmp/payload.tar.gz
          echo "12664dd223cc99087c85c29ddb2a41078ca206c04227ee07569310026b0267c0  /tmp/payload.tar.gz" | sha256sum -c -
          echo "Checksum verified."

      - name: Extract payload into repo (additive update, no deletions)
        run: |
          tar -xzf /tmp/payload.tar.gz -C .
          echo "Extracted:"
          echo "  pubspec.yaml"
          echo "  .clinerules"
          echo "  lib/core/constants/app_colors.dart"
          echo "  lib/core/haptics/haptic_service.dart"
          echo "  lib/core/database/database_helper.dart"
          echo "  lib/features/tasbih/logic/tasbih_cubit/tasbih_state.dart"
          echo "  lib/features/tasbih/logic/tasbih_cubit/tasbih_cubit.dart"
          echo "  lib/features/tasbih/presentation/widgets/haptic_counter_button.dart"

      - name: Architecture guard - 150 line limit (non-blocking)
        run: |
          over=""
          for f in $(find lib -name '*.dart'); do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 150 ]; then
              over="$over $f"
            fi
          done
          if [ -n "$over" ]; then
            echo "::warning::Files over 150 lines:$over"
          else
            echo "All Dart files within 150-line limit."
          fi

      - name: Architecture guard - offline-first (non-blocking)
        run: |
          if grep -rlE "package:(http|dio)/" lib/ 2>/dev/null; then
            echo "::warning::Networking package import found in lib/ - review against offline-first rule."
          else
            echo "No networking imports found in lib/."
          fi

      - name: Commit updated files
        run: |
          git config user.name "noor-ci"
          git config user.email "noor-ci@users.noreply.github.com"
          git add pubspec.yaml .clinerules lib/core/constants/app_colors.dart \
            lib/core/haptics/haptic_service.dart \
            lib/core/database/database_helper.dart \
            lib/features/tasbih/logic/tasbih_cubit/tasbih_state.dart \
            lib/features/tasbih/logic/tasbih_cubit/tasbih_cubit.dart \
            lib/features/tasbih/presentation/widgets/haptic_counter_button.dart
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update core architecture (colors, haptics, db helper, tasbih cubit)"
            git push
          fi

      - name: Summary
        run: |
          {
            echo "## Core architecture update applied"
            echo ""
            echo "Updated pubspec.yaml, .clinerules, app_colors.dart,"
            echo "haptic_service.dart, database_helper.dart, and the"
            echo "Tasbih cubit + accessible counter button."
            echo ""
            echo "Existing prayer_times / quran / azkar features were"
            echo "NOT touched by this payload."
          } >> "$GITHUB_STEP_SUMMARY"
