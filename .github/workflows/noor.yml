# Bismillahir Rahmanir Raheem - watermark: ALLAH
# noor - build pipeline (v8).
#
# Builds the release APK and publishes it as a GitHub Release (for
# sideload testing — an AAB can't be installed directly). Also builds
# a release AAB, uploaded as a build artifact only (not a Release
# asset) — this is the format the Play Store actually requires;
# having it building on every push means it's ready the moment a
# release keystore exists. Both are currently signed with Flutter's
# default debug key (no release signingConfig is configured yet) —
# generating and safely storing a real release keystore is a
# CLAUDE.md Phase 3 item that needs a human to do once, not CI.
#
# Unit tests are BLOCKING. A wrong qibla bearing must not ship.

name: Build Noor Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Scaffold and build
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: noor-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: noor-${{ runner.os }}-

      - name: Ensure asset folders exist
        run: mkdir -p assets/database

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyse
        continue-on-error: true
        run: flutter analyze --no-fatal-infos 2>&1 | tail -n 50

      - name: Unit tests (BLOCKING - qibla accuracy)
        run: |
          set -o pipefail
          flutter test 2>&1 | tee /tmp/test.log

      - name: Guard - 150 line limit
        continue-on-error: true
        run: |
          while IFS= read -r f; do
            N=$(wc -l < "$f")
            [ "$N" -gt 150 ] && echo "::warning file=$f::$N lines"
          done < <(find lib -name '*.dart')
          echo "line check complete"

      - name: Guard - offline first
        continue-on-error: true
        run: |
          if grep -rnE "package:(http|dio|firebase|sentry|mixpanel)" lib/; then
            echo "::warning::networking or analytics package in lib/"
          else
            echo "offline-first intact"
          fi

      - name: Pass 1 - Flutter Gradle migration
        run: timeout 900 flutter build apk --release 2>&1 | tail -n 12 || true

      - name: Append build overrides
        run: |
          cat > /tmp/append_override.sh <<'APPENDER'
          #!/bin/bash
          # Append an override block to android/app/build.gradle.kts.
          # Kotlin DSL allows configuring the `android` extension more than once,
          # so a second block simply overrides values from the first. No regex,
          # nothing to fail to match.
          set -e
          F=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          if [ -z "$F" ]; then
            echo "::error::No android/app/build.gradle[.kts] found"
            exit 1
          fi

          if grep -q "NOOR_BUILD_OVERRIDES" "$F"; then
            echo "Overrides already present in $F"
            exit 0
          fi

          if [ "${F##*.}" = "kts" ]; then
            cat >> "$F" << 'KTS'

          // --- NOOR_BUILD_OVERRIDES ---
          // Appended by CI. Kotlin DSL permits configuring the android extension
          // more than once; this block runs after the one above and wins.
          // compileSdk 36 is required by geolocator_android,
          // shared_preferences_android and sqflite_sqlcipher.
          android {
              compileSdk = 36
              defaultConfig {
                  minSdk = 23
              }
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          KTS
          else
            cat >> "$F" << 'GROOVY'

          // --- NOOR_BUILD_OVERRIDES ---
          android {
              compileSdk 36
              defaultConfig {
                  minSdkVersion 23
              }
              compileOptions {
                  coreLibraryDesugaringEnabled true
              }
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
          }
          GROOVY
          fi
          echo "Overrides appended to $F"
          APPENDER
          bash /tmp/append_override.sh
          F=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          echo "GRADLE_FILE=$F" >> "$GITHUB_ENV"
          grep -q "compileSdk = 36" "$F" || grep -q "compileSdk 36" "$F" || {
            echo "::error::override block missing"; exit 1; }
          echo "compileSdk 36 verified"

      - name: Pass 2 - build release APK
        run: |
          set -o pipefail
          # Guarantees a fully fresh build — no possibility of Pass 1's
          # (pre-override) build/ output, or anything else, silently
          # carrying through into what actually gets published below.
          flutter clean
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          flutter build apk --release \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define=BUILD_SHA="$SHORT_SHA" \
            --dart-define=BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            2>&1 | tee /tmp/build.log

      - name: Pass 3 - build release AAB (Play Store artifact)
        run: |
          set -o pipefail
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          flutter build appbundle --release \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define=BUILD_SHA="$SHORT_SHA" \
            --dart-define=BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            2>&1 | tee /tmp/build_aab.log

      - name: Upload AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: noor-v${{ github.run_number }}-release.aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             "noor-v${{ github.run_number }}.apk"
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          gh release create "build-${{ github.run_number }}" \
            "noor-v${{ github.run_number }}.apk" \
            --title "noor build ${{ github.run_number }} ($SHORT_SHA)" \
            --notes "On-screen build stamp (Home tab, bottom): Build $SHORT_SHA · #${{ github.run_number }}. Debug-signed."

      - name: Success summary
        if: success()
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          {
            echo "## noor build #${{ github.run_number }}"
            echo ""
            echo "APK built, tests passed, published as a Release."
            echo ""
            echo "- Size: $(du -h $APK | cut -f1)"
            echo "- Download: Releases tab, tag build-${{ github.run_number }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Failure detail
        if: failure()
        run: |
          {
            echo "## Build failed"
            echo ""
            echo "### Test output"
            echo '```'
            tail -n 60 /tmp/test.log 2>/dev/null || echo "tests did not run"
            echo '```'
            echo ""
            echo "### Build output"
            echo '```'
            tail -n 60 /tmp/build.log 2>/dev/null || echo "build did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
