name: add-project-docs

on:
  push:
    paths:
      - '.github/workflows/add_project_docs.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify payload
        env:
          PAYLOAD_B64: ""
        run: |
          echo "$PAYLOAD_B64" | base64 -d > /tmp/docs_payload.tar.gz
          echo "26a78120adfcc5d309216d80acf278f8e7e031e2478941bfc85ec0ce3d54c9e4  /tmp/docs_payload.tar.gz" | sha256sum -c -
          echo "Checksum verified."

      - name: Extract docs into repo
        run: |
          tar -xzf /tmp/docs_payload.tar.gz -C .
          echo "Extracted docs/ with 8 files:"
          ls -1 docs/

      - name: Commit and push
        run: |
          git config user.name "noor-ci"
          git config user.email "noor-ci@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: complete feature masterlist (full 87 items) and QA notes"
            git push
          fi

      - name: Summary
        run: |
          {
            echo "## Project docs updated"
            echo ""
            echo "docs/06_FEATURE_MASTERLIST.md now has the complete 87-item log."
            echo "docs/07 and docs/05 updated with new findings."
          } >> "$GITHUB_STEP_SUMMARY"
