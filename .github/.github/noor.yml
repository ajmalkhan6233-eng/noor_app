      - name: Commit sources
        run: |
          git config user.name  "noor-bootstrap[bot]"
          git config user.email "noor-bootstrap@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || {
            git commit -m "feat: cosmic splash and qibla calculator with tests"
            git push origin HEAD:${{ github.ref_name }}
          }

