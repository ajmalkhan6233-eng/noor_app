# Bismillahir Rahmanir Raheem - watermark: ALLAH
# noor - build pipeline (v7).
#
# Adds the cosmic splash (nur, rotation, twinkle, word-by-word reveal)
# behind a single config switch, plus the qibla great-circle calculator
# and circular-angle helpers with unit tests.
#
# Unit tests are BLOCKING. A wrong qibla bearing must not ship.

